name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Hardhat 3.9.1 exige Node >=22.13.0 (ver docs.hardhat.org) — Node 20
        # revienta con "ERROR: You are using Node.js 20.x which is not
        # supported by Hardhat". No hay matrix de compatibilidad aqui, solo
        # confirmamos 2 versiones dentro del rango soportado.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run tests (incluye asserts de gas 350k/120k)
        run: npm test

  gas-report:
    name: Gas report (comentario en el PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Sin esto, el GITHUB_TOKEN por defecto es read-only en repos nuevos y
    # createComment() revienta con 403 al intentar comentar en el PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Igual que el job "contracts": npm run test:gas corre Hardhat, que
          # exige Node >=22.13.0.
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Correr test:gas
        run: REPORT_GAS=true npm run test:gas > gas-report.txt 2>&1 || true
      - name: Comentar reporte en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('gas-report.txt', 'utf8').slice(-60000);
            const body = `### ⛽ Gas report\n\`\`\`\n${report}\n\`\`\`\n\n> Límite duro del cliente (00_PROJECT_OVERVIEW.md): createProject < 350,000 gas · pledge < 120,000 gas`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  frontend:
    name: Frontend (frontend2.0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @tanstack/react-start exige Node >=22.12.0 y pdfjs-dist exige
        # >=22.13.0/>=24 (ver "engines" de ambos paquetes, confirmado en el
        # warning EBADENGINE del log de CI en Node 20). Mismo motivo que en
        # el job "contracts".
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: "Run tests (23 tests: permissions, status, txErrors, useProjects)"
        run: npm run test

  lighthouse:
    name: Lighthouse (frontend2.0)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Corre en el runner limpio de GitHub, no en la maquina local de Abraham -
    # esto evita el bug de Chrome headless (NO_FCP) confirmado como propio del
    # entorno WSL local, no del codigo (ver 09_ROADMAP_MEJORAS.md § 7).
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun
