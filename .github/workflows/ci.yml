name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Hardhat 3.9.1 exige Node >=22.13.0 (ver docs.hardhat.org) — Node 20
        # revienta con "ERROR: You are using Node.js 20.x which is not
        # supported by Hardhat". No hay matrix de compatibilidad aqui, solo
        # confirmamos 2 versiones dentro del rango soportado.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run tests (incluye asserts de gas 350k/120k)
        run: npm test

  gas-report:
    name: Gas report (comentario en el PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Sin esto, el GITHUB_TOKEN por defecto es read-only en repos nuevos y
    # createComment() revienta con 403 al intentar comentar en el PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Igual que el job "contracts": npm run test:gas corre Hardhat, que
          # exige Node >=22.13.0.
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Correr test:gas
        run: REPORT_GAS=true npm run test:gas > gas-report.txt 2>&1 || true
      - name: Comentar reporte en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('gas-report.txt', 'utf8').slice(-60000);
            const body = `### ⛽ Gas report\n\`\`\`\n${report}\n\`\`\`\n\n> Límite duro del cliente (00_PROJECT_OVERVIEW.md): createProject < 350,000 gas · pledge < 120,000 gas`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  frontend:
    name: Frontend (frontend2.0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @tanstack/react-start exige Node >=22.12.0 y pdfjs-dist exige
        # >=22.13.0/>=24 (ver "engines" de ambos paquetes, confirmado en el
        # warning EBADENGINE del log de CI en Node 20). Mismo motivo que en
        # el job "contracts".
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: "Run tests (23 tests: permissions, status, txErrors, useProjects)"
        run: npm run test

  lighthouse:
    name: Lighthouse (frontend2.0)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Corre en el runner limpio de GitHub, no en la maquina local de Abraham -
    # esto evita el bug de Chrome headless (NO_FCP) confirmado como propio del
    # entorno WSL local, no del codigo (ver 09_ROADMAP_MEJORAS.md § 7).
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        # Fix (2026-07-28): NO_FCP en CI, causa distinta a la ya documentada
        # en docs/09_ROADMAP_MEJORAS.md § 7 (aquella era el buffering de
        # stdout de "npm run preview"). Aqui el server SI llegaba a imprimir
        # "Local:" (se ve en el log), pero LHCI ya habia dado por vencido el
        # readiness check (60s) antes de que ese output llegara -- "npx"
        # agrega su propio buffering encima del que ya tenia "npm run". En
        # vez de seguir dependiendo de un regex sobre stdout (fragil), ahora
        # arrancamos el server nosotros mismos y esperamos con "wait-on"
        # contra el puerto HTTP real -- deterministico, sin parseo de logs.
        # Ademas: el preset por defecto de Lighthouse simula red movil lenta
        # + 4x CPU throttling; en un runner compartido de GitHub Actions eso
        # puede empujar el primer paint mas alla de los 30s que Lighthouse
        # espera antes de tirar NO_FCP. Se cambia a preset "desktop" (sin
        # throttling) para que este check mida regresiones reales de la app,
        # no la varianza de CPU/red del runner -- los numeros de Performance
        # "de verdad" (mobile) se miden en local o con PageSpeed Insights
        # contra un deploy real (ver docs/09_ROADMAP_MEJORAS.md § 7).
        run: |
          npx vite preview --port 4173 --strictPort &
          SERVER_PID=$!
          npx wait-on http://localhost:4173/ --timeout 60000
          npx @lhci/cli@0.15.1 autorun \
            --collect.url=http://localhost:4173/ \
            --collect.numberOfRuns=1 \
            --collect.settings.preset=desktop \
            --collect.settings.maxWaitForFcp=45000 \
            --collect.settings.maxWaitForLoad=60000 \
            --upload.target=temporary-public-storage
          kill $SERVER_PID

  e2e:
    name: E2E (Playwright + Anvil)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # No bloqueante todavia (docs/09_ROADMAP_MEJORAS.md § 12, mismo criterio
    # ya usado con el job "lighthouse" en su primera version): recien nuevo,
    # se promueve a bloqueante una vez haya corridas estables confirmadas.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install root deps (Hardhat)
        run: npm ci
      - name: Deploy Crowdfunding to Anvil
        run: npm run e2e:setup
      - name: Install frontend2.0 deps
        working-directory: frontend2.0
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend2.0
        run: npx playwright install --with-deps chromium
      - name: Run E2E specs
        working-directory: frontend2.0
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend2.0/playwright-report
          retention-days: 7
