name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Hardhat 3.9.1 exige Node >=22.13.0 (ver docs.hardhat.org) — Node 20
        # revienta con "ERROR: You are using Node.js 20.x which is not
        # supported by Hardhat". No hay matrix de compatibilidad aqui, solo
        # confirmamos 2 versiones dentro del rango soportado.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run tests (incluye asserts de gas 350k/120k)
        run: npm test

  gas-report:
    name: Gas report (comentario en el PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Sin esto, el GITHUB_TOKEN por defecto es read-only en repos nuevos y
    # createComment() revienta con 403 al intentar comentar en el PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Igual que el job "contracts": npm run test:gas corre Hardhat, que
          # exige Node >=22.13.0.
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Correr test:gas
        run: REPORT_GAS=true npm run test:gas > gas-report.txt 2>&1 || true
      - name: Comentar reporte en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('gas-report.txt', 'utf8').slice(-60000);
            const body = `### ⛽ Gas report\n\`\`\`\n${report}\n\`\`\`\n\n> Límite duro del cliente (00_PROJECT_OVERVIEW.md): createProject < 350,000 gas · pledge < 120,000 gas`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  frontend:
    name: Frontend (frontend2.0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @tanstack/react-start exige Node >=22.12.0 y pdfjs-dist exige
        # >=22.13.0/>=24 (ver "engines" de ambos paquetes, confirmado en el
        # warning EBADENGINE del log de CI en Node 20). Mismo motivo que en
        # el job "contracts".
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: "Run tests (23 tests: permissions, status, txErrors, useProjects)"
        run: npm run test

  lighthouse:
    name: Lighthouse (frontend2.0)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Corre en el runner limpio de GitHub, no en la maquina local de Abraham -
    # esto evita el bug de Chrome headless (NO_FCP) confirmado como propio del
    # entorno WSL local, no del codigo (ver 09_ROADMAP_MEJORAS.md § 7).
    defaults:
      run:
        working-directory: frontend2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend2.0/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        # Fix (2026-07-28): NO_FCP en CI. Primer fix (server management +
        # wait-on + preset desktop) no lo resolvió -- el timeout se cumple
        # EXACTO al segundo configurado (30s default, luego 45s configurado)
        # incluso sin throttling, lo cual apunta a un hang real (una promesa
        # que nunca resuelve), no a lentitud. Revisión manual de wagmi.ts,
        # DemoSection/AppShell/ConnectWallet/Hero/hooks de scroll no
        # encontró causa obvia (todo el codigo cliente-only ya esta bien
        # guardado con useEffect). Este step ahora:
        # 1. Corre un curl de control ANTES de Lighthouse para aislar si el
        #    hang es del server (curl tambien cuelga) o especifico de Chrome.
        # 2. Vuelca el log de "vite preview" al final (incluye los [DIAG]
        #    temporales agregados en src/server.ts) para ver si el fetch
        #    handler de TanStack Start llega a resolver.
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          SERVER_PID=$!
          npx wait-on http://localhost:4173/ --timeout 60000
          echo "--- curl de control (aisla si el hang es del server o de Chrome) ---"
          time curl -sv --max-time 20 http://localhost:4173/ -o /tmp/curl-out.html || echo "curl fallo/timeout, exit=$?"
          wc -c /tmp/curl-out.html || true
          set +e
          npx @lhci/cli@0.15.1 autorun \
            --collect.url=http://localhost:4173/ \
            --collect.numberOfRuns=1 \
            --collect.settings.preset=desktop \
            --collect.settings.maxWaitForFcp=45000 \
            --collect.settings.maxWaitForLoad=60000 \
            --upload.target=temporary-public-storage
          LHCI_EXIT=$?
          kill $SERVER_PID
          echo "--- output de 'npx vite preview' (incluye los [DIAG] de src/server.ts) ---"
          cat /tmp/vite-preview.log
          exit $LHCI_EXIT
